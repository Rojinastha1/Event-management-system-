<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Events - Event Management System</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="page">
  <div class="page-header">
    <div>
      <h1>Events</h1>
      <p>Available Events</p>
    </div>
    <a href="event-form.html" class="btn">+ Add Event</a>
  </div>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Search events by name..." />
  </div>

  <div id="message-box"></div>

  <table>
    <thead>
      <tr><th>Name</th><th>Date</th><th>Location</th><th>Attendees</th><th></th></tr>
    </thead>
    <tbody id="rows">
      <tr class="empty"><td colspan="5">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script src="api.js"></script>
<script src="events.js"></script>

</body>
</html>
