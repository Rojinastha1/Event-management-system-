<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendee Form - Event Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="page">
  <div class="page-header">
    <div>
      <p class="eyebrow">Ledger &middot; New entry</p>
      <h1 id="form-title">Add Attendee</h1>
      <p><a href="attendees.html">&larr; Back to Attendees</a></p>
    </div>
  </div>

  <div id="message-box"></div>

  <div class="card">
    <form id="attendee-form">
      <div class="field">
        <label for="name">Name *</label>
        <input type="text" id="name" required />
      </div>
      <div class="field">
        <label for="email">Email *</label>
        <input type="email" id="email" required />
      </div>
      <div class="field">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" required />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn" id="save-btn">Save Attendee</button>
        <a href="attendees.html" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script src="api.js"></script>
<script src="attendee-form.js"></script>

</body>
</html>
