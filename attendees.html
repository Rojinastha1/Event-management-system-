<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendees - Event Management System</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="page">
  <div class="page-header">
    <div>
      <h1>Attendees</h1>
      <p>Everyone registered in the system.</p>
    </div>
    <a href="attendee-form.html" class="btn">+ Add Attendee</a>
  </div>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Search attendees by name..." />
  </div>

  <div id="message-box"></div>

  <table>
    <thead><tr><th>Name</th><th>Email</th><th>Phone Number</th><th></th></tr></thead>

      <tr class="empty"><td colspan="4">Loading...</td></tr>
    </tbody>
  </table>

<script src="api.js"></script>

</html>
